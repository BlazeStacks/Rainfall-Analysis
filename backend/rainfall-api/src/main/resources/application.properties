server.port=${PORT:8080}

# Application name
spring.application.name=rainfall-api

# Comma-separated frontend origins allowed to call the API.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}

# JSON serialisation — exclude null fields from responses
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false

# Logging
logging.level.com.rainfall=INFO
logging.level.org.springframework.web=WARN

# Disable Spring Boot banner (optional — cleaner startup output)
spring.main.banner-mode=off
