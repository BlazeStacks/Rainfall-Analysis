server.port=8080

# Application name
spring.application.name=rainfall-api

# JSON serialisation — exclude null fields from responses
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false

# Logging
logging.level.com.rainfall=INFO
logging.level.org.springframework.web=WARN

# Disable Spring Boot banner (optional — cleaner startup output)
spring.main.banner-mode=off
